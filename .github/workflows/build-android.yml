name: Build OpenCode Go Agent APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, opencode-go-agent]
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify source tree
        run: python tools/verify_source.py

      - name: Run core JVM smoke tests
        run: bash tools/run_core_smoke.sh

      - name: Compile full Java tree against verification stubs
        run: bash tools/run_android_stub_compile.sh

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK and run lint
        run: gradle --no-daemon --stacktrace \
            :app:assembleSideloadDebug :app:lintSideloadDebug \
            :app:assembleModernDebug :app:lintModernDebug

      - name: Create checksums
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            sha256sum "$apk" > "$apk.sha256"
          done

      - name: Package verified source
        run: |
          rm -f /tmp/OpenCode-Go-Agent-v11.0-source.zip
          zip -r /tmp/OpenCode-Go-Agent-v11.0-source.zip . \
            -x '.git/*' '.gradle/*' 'build/*' 'app/build/*'
          mv /tmp/OpenCode-Go-Agent-v11.0-source.zip .
          sha256sum OpenCode-Go-Agent-v11.0-source.zip > OpenCode-Go-Agent-v11.0-source.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Go-Agent-v11.0
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
            app/build/outputs/apk/sideload/debug/app-sideload-debug.apk.sha256
            app/build/outputs/apk/modern/debug/app-modern-debug.apk
            app/build/outputs/apk/modern/debug/app-modern-debug.apk.sha256
            app/build/reports/lint-results-sideloadDebug.html
            app/build/reports/lint-results-modernDebug.html
            OpenCode-Go-Agent-v11.0-source.zip
            OpenCode-Go-Agent-v11.0-source.zip.sha256
